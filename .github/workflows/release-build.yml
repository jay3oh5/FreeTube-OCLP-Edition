name: Release Build (OCLP Edition)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name'
        required: true
        default: 'v0.26.0-oclp.1'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS (x64)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build macOS Application (x64)
        run: pnpm run build

      - name: Prepare and rename assets
        run: |
          mkdir -p dist-assets
          version=$(jq -r '.version' package.json)
          
          [ -f "build/freetube-${version}.dmg" ] && cp "build/freetube-${version}.dmg" "dist-assets/freetube-${version}-oclp-mac-x64.dmg"
          [ -f "build/freetube-${version}-mac.zip" ] && cp "build/freetube-${version}-mac.zip" "dist-assets/freetube-${version}-oclp-mac-x64.zip"
          [ -f "build/freetube-${version}-mac.7z" ] && cp "build/freetube-${version}-mac.7z" "dist-assets/freetube-${version}-oclp-mac-x64.7z"
          
          ls -lh dist-assets/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-x64
          path: dist-assets/*

  publish-release:
    name: Publish GitHub Release
    needs: build-mac
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.7z" \) -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Publish Release to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v0.26.0-oclp.1"
          fi
          
          echo "Creating or updating GitHub Release for $TAG"
          gh release create "$TAG" release-files/* \
            --title "FreeTube $TAG (OCLP & Legacy GPU Edition)" \
            --notes-file RELEASE_NOTES.md \
            --repo "${{ github.repository }}" || \
          gh release upload "$TAG" release-files/* --clobber --repo "${{ github.repository }}"
